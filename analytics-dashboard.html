<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GhostNet Analytics</title>
<style>
  :root {
    --bg: #020428;
    --surface: #0a0e3a;
    --border: #1a1f5a;
    --text: #e0e6ff;
    --muted: #7a82b8;
    --accent: #6c63ff;
    --accent2: #00e5ff;
    --green: #00e676;
    --orange: #ff9100;
    --red: #ff5252;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .header h1 span { color: var(--accent); }
  .period-selector {
    display: flex;
    gap: 8px;
  }
  .period-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.2s;
  }
  .period-btn.active, .period-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .card-value {
    font-size: 2rem;
    font-weight: 700;
    line-height: 1;
  }
  .card-sub {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 6px;
  }
  .card-value.green { color: var(--green); }
  .card-value.accent { color: var(--accent); }
  .card-value.cyan { color: var(--accent2); }
  .card-value.orange { color: var(--orange); }
  .chart-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .chart-title {
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .chart-container {
    width: 100%;
    height: 220px;
    position: relative;
  }
  canvas { width: 100% !important; height: 100% !important; }
  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .feature-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: rgba(108, 99, 255, 0.08);
    border-radius: 8px;
  }
  .feature-name {
    font-size: 0.85rem;
    font-weight: 600;
  }
  .feature-count {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent2);
  }
  .privacy-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0, 230, 118, 0.1);
    border: 1px solid rgba(0, 230, 118, 0.3);
    color: var(--green);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .loading {
    text-align: center;
    padding: 60px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .error-msg {
    background: rgba(255, 82, 82, 0.1);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 16px;
    border-radius: 8px;
    text-align: center;
    display: none;
  }
  @media (max-width: 600px) {
    body { padding: 12px; }
    .grid { grid-template-columns: 1fr 1fr; }
    .card-value { font-size: 1.5rem; }
  }
</style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Ghost<span>Net</span> Analytics</h1>
      <div class="privacy-badge" style="margin-top:8px;">PRIVACY-FIRST &mdash; NO PERSONAL DATA COLLECTED</div>
    </div>
    <div class="period-selector">
      <button class="period-btn" data-days="7">7d</button>
      <button class="period-btn active" data-days="30">30d</button>
      <button class="period-btn" data-days="90">90d</button>
    </div>
  </div>

  <div id="error" class="error-msg"></div>
  <div id="loading" class="loading">Loading analytics...</div>

  <div id="content" style="display:none;">
    <div class="grid">
      <div class="card">
        <div class="card-label">DAU Today</div>
        <div class="card-value green" id="dau-today">0</div>
        <div class="card-sub">Active users today</div>
      </div>
      <div class="card">
        <div class="card-label">Avg DAU</div>
        <div class="card-value accent" id="dau-avg">0</div>
        <div class="card-sub">Daily average for period</div>
      </div>
      <div class="card">
        <div class="card-label">Messages Sent</div>
        <div class="card-value cyan" id="total-messages">0</div>
        <div class="card-sub">Total in period</div>
      </div>
      <div class="card">
        <div class="card-label">Shield Activations</div>
        <div class="card-value orange" id="shield-activations">0</div>
        <div class="card-sub">Ghost Shield enabled</div>
      </div>
    </div>

    <div class="chart-section">
      <div class="chart-title">Daily Activity</div>
      <div class="chart-container">
        <canvas id="dailyChart"></canvas>
      </div>
    </div>

    <div class="chart-section">
      <div class="chart-title">Feature Usage</div>
      <div class="features-grid" id="features-list"></div>
    </div>
  </div>

<script>
const BACKEND = window.location.origin;

function getToken() {
  try {
    const raw = sessionStorage.getItem('ghostnet_token')
              || localStorage.getItem('ghostnet_token')
              || localStorage.getItem('ghostnet_jwt');
    if (!raw) return null;
    try { const p = JSON.parse(raw); return p?.token || raw; }
    catch { return raw; }
  } catch { return null; }
}

let chartInstance = null;

async function loadDashboard(days = 30) {
  const token = getToken();
  if (!token) {
    showError('Not authenticated. Please log in to GhostNet first.');
    return;
  }

  document.getElementById('loading').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  document.getElementById('error').style.display = 'none';

  try {
    const headers = { 'Authorization': `Bearer ${token}` };
    const secret = new URLSearchParams(window.location.search).get('secret');
    if (secret) headers['X-Analytics-Secret'] = secret;

    const res = await fetch(`${BACKEND}/analytics/dashboard?days=${days}`, { headers });
    if (!res.ok) throw new Error(res.status === 403 ? 'Access denied' : `HTTP ${res.status}`);
    const data = await res.json();

    document.getElementById('dau-today').textContent = data.summary.dauToday.toLocaleString();
    document.getElementById('dau-avg').textContent = data.summary.dauAvg.toLocaleString();
    document.getElementById('total-messages').textContent = data.summary.totalMessages.toLocaleString();
    document.getElementById('shield-activations').textContent = data.summary.shieldActivations.toLocaleString();

    renderChart(data);
    renderFeatures(data.summary.topFeatures);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  } catch (err) {
    showError(err.message);
  }
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

function renderChart(data) {
  const canvas = document.getElementById('dailyChart');
  const ctx = canvas.getContext('2d');
  if (chartInstance) { chartInstance = null; }

  const dau = data.dau || [];
  const daily = data.daily || [];

  const labels = dau.map(d => d.date.slice(5));
  const dauData = dau.map(d => d.users);
  const msgData = labels.map(label => {
    const match = daily.find(d => d.date.slice(5) === label);
    return match ? match.messages : 0;
  });
  const shieldData = labels.map(label => {
    const match = daily.find(d => d.date.slice(5) === label);
    return match ? match.shield : 0;
  });

  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * (window.devicePixelRatio || 1);
  canvas.height = rect.height * (window.devicePixelRatio || 1);
  ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);

  const w = rect.width;
  const h = rect.height;
  const pad = { top: 20, right: 20, bottom: 30, left: 50 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;

  ctx.clearRect(0, 0, w, h);

  const allVals = [...dauData, ...msgData, ...shieldData];
  const maxVal = Math.max(...allVals, 1);

  ctx.strokeStyle = '#1a1f5a';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (plotH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
    ctx.fillStyle = '#7a82b8';
    ctx.font = '10px Inter, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxVal - (maxVal / 4) * i), pad.left - 8, y + 4);
  }

  if (labels.length > 1) {
    const step = Math.max(1, Math.floor(labels.length / 8));
    ctx.fillStyle = '#7a82b8';
    ctx.font = '9px Inter, sans-serif';
    ctx.textAlign = 'center';
    for (let i = 0; i < labels.length; i += step) {
      const x = pad.left + (plotW / (labels.length - 1)) * i;
      ctx.fillText(labels[i], x, h - 8);
    }
  }

  function drawLine(data, color, dashed) {
    if (data.length < 2) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.setLineDash(dashed ? [5, 4] : []);
    ctx.beginPath();
    data.forEach((val, i) => {
      const x = pad.left + (plotW / (data.length - 1)) * i;
      const y = pad.top + plotH - (val / maxVal) * plotH;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.setLineDash([]);
  }

  drawLine(dauData, '#00e676', false);
  drawLine(msgData, '#00e5ff', false);
  drawLine(shieldData, '#ff9100', true);

  const legendItems = [
    { label: 'DAU', color: '#00e676' },
    { label: 'Messages', color: '#00e5ff' },
    { label: 'Shield', color: '#ff9100' },
  ];
  let lx = pad.left;
  ctx.font = '10px Inter, sans-serif';
  legendItems.forEach(item => {
    ctx.fillStyle = item.color;
    ctx.fillRect(lx, 4, 12, 3);
    ctx.fillStyle = '#7a82b8';
    ctx.fillText(item.label, lx + 16, 10);
    lx += ctx.measureText(item.label).width + 32;
  });

  chartInstance = true;
}

function renderFeatures(features) {
  const el = document.getElementById('features-list');
  if (!features || !features.length) {
    el.innerHTML = '<div style="color:var(--muted);padding:20px;">No feature data yet</div>';
    return;
  }
  el.innerHTML = features.map(f => `
    <div class="feature-item">
      <span class="feature-name">${escHtml(f.feature)}</span>
      <span class="feature-count">${f.total.toLocaleString()}</span>
    </div>
  `).join('');
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadDashboard(parseInt(btn.dataset.days));
  });
});

loadDashboard(30);
</script>
</body>
</html>
